name: validate

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable canonical symlink checkout
        run: git config --global core.symlinks true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q skills/find-product-opportunities/scripts skills/link-ops/scripts scripts
      - name: Verify resources and upstream lock
        run: python scripts/validate_repository.py

  official-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned official validators
        run: |
          python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          npm install --global @anthropic-ai/claude-code@2.1.308
      - name: Official Skill and plugin validation
        run: python scripts/validate_repository.py --skills-ref skills-ref --claude claude
